name: Probe access logs (read-only)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: List logs
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$PORT" "$USER@$HOST" '
            for d in domains/igx.co.id/logs logs domains/igx.co.id/public_html/logs; do
              echo "== $d"; ls -la --time-style=long-iso "$d" 2>&1 | head -60
            done
            echo "== find logs"; find domains -maxdepth 3 \( -name "*access*" -o -name "*.log*" \) 2>/dev/null | head -30
            df -h . | tail -1
          '
