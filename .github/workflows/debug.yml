name: Server Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Diagnose 500 via SSH
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          echo "=== Trying SFTP ==="
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            echo "PHP VERSION:"
            for php in /opt/alt/php84/usr/bin/php /opt/alt/php82/usr/bin/php /opt/alt/php81/usr/bin/php /usr/bin/php; do
              [ -x "$php" ] && echo "  $php: $($php -v 2>&1 | head -1)"
            done
            echo "=== APACHE ERROR LOG ==="
            tail -40 domains/igx.co.id/error_log 2>/dev/null || echo "NO ERROR_LOG"
            echo "=== LARAVEL LOG ==="
            tail -40 domains/igx.co.id/storage/logs/laravel.log 2>/dev/null || echo "NO LARAVEL.LOG"
            echo "=== ARTISAN ==="
            cd domains/igx.co.id
            for php in /opt/alt/php84/usr/bin/php /opt/alt/php82/usr/bin/php; do
              if [ -x "$php" ]; then
                $php artisan --version 2>&1
                $php artisan view:clear 2>&1
                $php artisan config:clear 2>&1
                $php artisan cache:clear 2>&1
                break
              fi
            done
            echo "=== DONE ==="
          ' 2>&1 || echo "SSH FAILED"
