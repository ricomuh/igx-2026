name: Server Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Check Error
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "=== ENV CHECK ==="
            grep -E "APP_KEY|DB_" .env 2>/dev/null | sed "s/=.*/=***/"
            echo "=== ERROR LOG ==="
            tail -30 error_log 2>/dev/null || echo "no error_log"
            echo "=== LARAVEL LOG ==="
            tail -30 storage/logs/laravel.log 2>/dev/null || echo "no laravel.log"
            echo "=== APACHE ERROR ==="
            find . -name "error_log" -exec tail -20 {} \; 2>/dev/null
            echo "=== ARTISAN TEST ==="
            /opt/alt/php84/usr/bin/php artisan about 2>&1 | head -30
            echo "=== DONE ==="
          ' 2>&1
