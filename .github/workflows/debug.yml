name: Server Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Diagnose 500 via SSH
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "=== HTACCESS ==="
            cat .htaccess 2>/dev/null || echo "NO .htaccess"
            echo "=== PUBLIC HTACCESS ==="
            cat public/.htaccess 2>/dev/null || echo "NO public .htaccess"
            echo "=== PUBLIC_HTML ==="
            ls -la public_html/ 2>/dev/null | head -10 || echo "NO public_html"
            echo "=== PHP HANDLER ==="
            cat .htaccess 2>/dev/null | grep -i php || echo "No PHP handler in .htaccess"
            echo "=== ARTISAN WITH FULL PATH ==="
            /opt/alt/php84/usr/bin/php artisan --version 2>&1
            /opt/alt/php84/usr/bin/php artisan view:clear 2>&1
            /opt/alt/php84/usr/bin/php artisan config:clear 2>&1
            /opt/alt/php84/usr/bin/php artisan cache:clear 2>&1
            echo "=== INDEX.PHP ==="
            head -5 public/index.php 2>/dev/null
            echo "=== STORAGE PERMS ==="
            ls -la storage/ 2>/dev/null
            ls -la bootstrap/cache/ 2>/dev/null
            echo "=== DONE ==="
          ' 2>&1 || echo "SSH FAILED"
