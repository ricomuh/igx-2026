name: Server Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Fix & Diagnose
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "=== VENDOR CHECK ==="
            ls vendor/autoload.php 2>&1
            echo "=== ENV CHECK ==="
            ls -la .env 2>&1
            head -3 .env 2>&1
            echo "=== ARTISAN RAW ==="
            /opt/alt/php84/usr/bin/php artisan --version 2>&1
            echo "EXIT: $?"
            echo "=== COMPOSER ==="
            which composer 2>&1 || which composer.phar 2>&1 || ls /opt/alt/php84/usr/bin/composer* 2>&1 || echo "NO COMPOSER"
            echo "=== PHP MODULES ==="
            /opt/alt/php84/usr/bin/php -m 2>&1 | grep -iE "pdo|mysql|mbstring|xml|json|curl|openssl"
            echo "=== ARTISAN WITH FULL ERROR ==="
            /opt/alt/php84/usr/bin/php -d display_errors=1 -d error_reporting=E_ALL artisan --version 2>&1
            echo "=== DONE ==="
          ' 2>&1
