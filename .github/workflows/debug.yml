name: Server Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Migrate & Fix
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "=== MIGRATE STATUS ==="
            /opt/alt/php84/usr/bin/php artisan migrate:status 2>&1 | head -20
            echo "=== RUN MIGRATIONS ==="
            /opt/alt/php84/usr/bin/php artisan migrate --force 2>&1
            echo "=== CLEAR AFTER MIGRATE ==="
            /opt/alt/php84/usr/bin/php artisan cache:clear 2>&1 || true
            /opt/alt/php84/usr/bin/php artisan config:clear 2>&1 || true
            /opt/alt/php84/usr/bin/php artisan route:clear 2>&1 || true
            echo "=== DONE ==="
          ' 2>&1
