name: Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: SSH Diagnostics Phase 2
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "===== LOG FILES ====="
            ls -la storage/logs/
            echo "===== HOME LOGS ====="
            ls ~/logs/ 2>/dev/null | head
            echo "===== LOCAL CURL (before) ====="
            curl -s -o /dev/null -w "code=%{http_code}\n" -H "Host: igx-03.leolitgames.com" http://127.0.0.1/
            echo "===== FRESH LOG AFTER CURL ====="
            tail -8 storage/logs/laravel.log
            echo "===== PHP-FPM ERROR LOG (last 30) ====="
            tail -30 ~/logs/error.log 2>/dev/null || echo "no ~/logs/error.log"
            echo "===== ENV SPECIAL CHARS ====="
            grep -c "!" .env || true
            grep -c "#" .env || true
            echo "===== INDEX.PHP head ====="
            head -5 public_html/index.php
            echo "===== .htaccess? ====="
            ls -la public_html/.htaccess 2>/dev/null || echo "no .htaccess"
            echo "===== STORAGE LINK ====="
            ls -la public_html/storage 2>/dev/null || echo "no storage link"
            echo "===== FRESH LOG CHECK AFTER 2nd CURL ====="
            curl -s -o /dev/null -w "code=%{http_code}\n" -H "Host: igx-03.leolitgames.com" "http://127.0.0.1/admin"
            sleep 1
            tail -3 storage/logs/laravel.log
            echo "DONE"
          ' 2>&1
