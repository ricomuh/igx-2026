name: Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: SSH Enable Debug
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "===== KERNEL RENDER TESTS ====="
            /opt/alt/php84/usr/bin/php -r '\''
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
              foreach (["http://igx-03.leolitgames.com/" => "HOME", "http://igx-03.leolitgames.com/pals" => "PALS", "http://ticket.igx-03.leolitgames.com/" => "TICKET"] as $url => $label) {
                try {
                  $res = $kernel->handle(Illuminate\Http\Request::create($url, "GET"));
                  echo $label.": ".$res->getStatusCode()."\n";
                } catch (Throwable $e) {
                  echo $label." EXCEPTION: ".get_class($e).": ".$e->getMessage()." AT ".$e->getFile().":".$e->getLine()."\n";
                  $t = $e->getTrace();
                  if (isset($t[1])) echo "  TRACE1: ".($t[1]["file"] ?? "?").":".($t[1]["line"] ?? "?")." ".($t[1]["function"] ?? "?")."\n";
                }
              }
            '\''
            echo "===== CONFIG.PHP SIZE ====="
            ls -la bootstrap/cache/config.php 2>&1
            echo "===== CONFIG:CACHE RAW OUTPUT ====="
            /opt/alt/php84/usr/bin/php artisan config:cache 2>&1
            echo "EXIT=$?"
            echo "===== CONFIG.PHP SIZE AFTER ====="
            ls -la bootstrap/cache/config.php 2>&1
            echo "===== OPCACHE SETTINGS ====="
            /opt/alt/php84/usr/bin/php -i 2>/dev/null | grep -iE "opcache.enable|validate_timestamps|revalidate_freq" | head -5
            echo "===== ARTISAN ENV ====="
            /opt/alt/php84/usr/bin/php artisan env 2>&1 | head -2
            echo "===== LOCAL CURL https igx-03 ====="
            curl -sk -o /dev/null -w "code=%{http_code}\n" -H "Host: igx-03.leolitgames.com" https://127.0.0.1/
            echo "===== LOCAL CURL https ticket ====="
            curl -sk -o /dev/null -w "code=%{http_code}\n" -H "Host: ticket.igx-03.leolitgames.com" https://127.0.0.1/
            echo "===== LOCAL CURL https ticket/pals ====="
            curl -sk -o /dev/null -w "code=%{http_code}\n" -H "Host: ticket.igx-03.leolitgames.com" https://127.0.0.1/pals
            echo DONE
          ' 2>&1

      - name: Curl Public (trace)
        run: |
          echo "===== PUBLIC igx-03 ====="
          curl -s --max-time 25 https://igx-03.leolitgames.com/ -o /dev/null -w "code=%{http_code}\n"
          echo "===== PUBLIC ticket.igx-03 ====="
          curl -s --max-time 25 https://ticket.igx-03.leolitgames.com/ -o /tmp/ticket.html -w "code=%{http_code}\n" || true
          echo "===== PUBLIC ticket.igx-03/pals ====="
          curl -s --max-time 25 https://ticket.igx-03.leolitgames.com/pals -o /dev/null -w "code=%{http_code}\n" || true
          echo "--- ticket trace (first 4000 chars) ---"
          head -c 4000 /tmp/ticket.html

      - name: SSH Revert Debug
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "===== LARAVEL LOG FRESH (last 40) ====="
            tail -40 storage/logs/laravel.log 2>/dev/null || echo "no laravel.log"
            echo "===== VIEW CACHE DIR ====="
            ls storage/framework/views/ 2>/dev/null | head -3
            echo "===== REVERT DEBUG OFF ====="
            sed -i "s/^APP_DEBUG=.*/APP_DEBUG=false/" .env
            /opt/alt/php84/usr/bin/php artisan config:cache 2>&1 | tail -1 || echo "revert FAIL"
            grep "^APP_DEBUG" .env
            echo DONE
          ' 2>&1
