name: Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: SSH Diagnostics Phase 2
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "===== LOG FILES ====="
            ls -la storage/logs/
            echo "===== LOCAL CURL igx.co.id ====="
            curl -s -o /dev/null -w "code=%{http_code}\n" -H "Host: igx.co.id" http://127.0.0.1/
            curl -s -H "Host: igx.co.id" http://127.0.0.1/ | head -c 200
            echo
            echo "===== LOCAL CURL www.igx.co.id ====="
            curl -s -o /dev/null -w "code=%{http_code}\n" -H "Host: www.igx.co.id" http://127.0.0.1/
            echo "===== ALL HOSTINGER LOGS (recent) ====="
            find ~ -maxdepth 4 -name "*.log" -mmin -720 2>/dev/null | head -20
            echo "===== DOMAIN LOGS DIR ====="
            ls -la domains/igx.co.id/logs/ 2>/dev/null || echo "no domain logs dir"
            echo "===== ERROR LOG TAIL ====="
            tail -40 ~/logs/error.log 2>/dev/null || tail -40 ~/logs/error_log 2>/dev/null || echo "no error log found"
            echo "===== ROUTE CACHE VALID? ====="
            /opt/alt/php84/usr/bin/php artisan route:list --path=/ 2>&1 | head -5 || echo "route:list FAIL"
            echo "===== ARTISAN BOOT TEST ====="
            /opt/alt/php84/usr/bin/php artisan env 2>&1 | head -3 || echo "artisan env FAIL"
            echo "DONE"
          ' 2>&1
