name: Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: SSH Enable Debug
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "===== KERNEL RENDER TEST (ticket landing) ====="
            /opt/alt/php84/usr/bin/php -r '\''
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $kernel = $app->make(Illuminate\Contracts\Http\Kernel::class);
              try {
                $req = Illuminate\Http\Request::create("http://ticket.igx-03.leolitgames.com/", "GET");
                $res = $kernel->handle($req);
                echo "STATUS: ".$res->getStatusCode()."\n";
                $body = substr($res->getContent(), 0, 300);
                echo "BODY: ".str_replace("\n", " ", $body)."\n";
              } catch (Throwable $e) {
                echo "EXCEPTION: ".get_class($e).": ".$e->getMessage()."\n";
                echo "AT: ".$e->getFile().":".$e->getLine()."\n";
                echo "TRACE0: ".($e->getTrace()[0]["file"] ?? "?").":".($e->getTrace()[0]["line"] ?? "?")." ".($e->getTrace()[0]["function"] ?? "?")."\n";
              }
            '\''
            echo "===== TOGGLE DEBUG ON ====="
            sed -i "s/^APP_DEBUG=.*/APP_DEBUG=true/" .env
            /opt/alt/php84/usr/bin/php artisan config:cache 2>&1 | tail -1 || echo "config:cache FAIL"
            grep "^APP_DEBUG" .env
            echo DONE
          ' 2>&1

      - name: Curl Public (trace)
        run: |
          echo "===== PUBLIC igx-03 ====="
          curl -s --max-time 25 https://igx-03.leolitgames.com/ -o /dev/null -w "code=%{http_code}\n"
          echo "===== PUBLIC ticket.igx-03 ====="
          curl -s --max-time 25 https://ticket.igx-03.leolitgames.com/ -o /tmp/ticket.html -w "code=%{http_code}\n" || true
          echo "===== PUBLIC ticket.igx-03/pals ====="
          curl -s --max-time 25 https://ticket.igx-03.leolitgames.com/pals -o /dev/null -w "code=%{http_code}\n" || true
          echo "--- ticket trace (first 4000 chars) ---"
          head -c 4000 /tmp/ticket.html

      - name: SSH Revert Debug
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $PORT"
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id
            echo "===== LARAVEL LOG FRESH (last 40) ====="
            tail -40 storage/logs/laravel.log 2>/dev/null || echo "no laravel.log"
            echo "===== VIEW CACHE DIR ====="
            ls storage/framework/views/ 2>/dev/null | head -3
            echo "===== REVERT DEBUG OFF ====="
            sed -i "s/^APP_DEBUG=.*/APP_DEBUG=false/" .env
            /opt/alt/php84/usr/bin/php artisan config:cache 2>&1 | tail -1 || echo "revert FAIL"
            grep "^APP_DEBUG" .env
            echo DONE
          ' 2>&1
