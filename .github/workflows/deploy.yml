name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build Assets
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Hostinger
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -p $PORT"

          # Retry rsync up to 3 times
          for i in 1 2 3; do
            echo "=== Rsync attempt $i ==="
            sshpass -e rsync -avz \
              -e "ssh $SSH_OPTS" \
              --exclude '.git' \
              --exclude 'node_modules' \
              --exclude '.env' \
              --exclude 'tests' \
              --exclude 'storage/framework/cache/data/*' \
              ./ $USER@$HOST:domains/igx.co.id/ && break
            echo "Attempt $i failed, retrying..."
            sleep 15
          done

          # Post-deploy setup: composer install + env + cache
          echo "=== Post-deploy setup ==="
          sshpass -e ssh $SSH_OPTS $USER@$HOST \
            "cd domains/igx.co.id && \
             echo '---COMPOSER INSTALL---' && \
             /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction 2>&1 && \
             echo '---ENV CHECK---' && \
             ( [ -f .env ] || ( cp .env.example .env && /opt/alt/php84/usr/bin/php artisan key:generate --force 2>&1 ) ) && \
             echo '---VERIFY MANIFEST---' && \
             python3 -c \"import json; d=json.load(open('public/build/manifest.json')); print(d['resources/css/app.css']['file'])\" && \
             echo '---CLEAR + OPTIMIZE---' && \
             /opt/alt/php84/usr/bin/php artisan view:clear 2>&1 && \
             /opt/alt/php84/usr/bin/php artisan config:clear 2>&1 && \
             /opt/alt/php84/usr/bin/php artisan cache:clear 2>&1 && \
             /opt/alt/php84/usr/bin/php artisan config:cache 2>&1 && \
             /opt/alt/php84/usr/bin/php artisan route:cache 2>&1 && \
             /opt/alt/php84/usr/bin/php artisan view:cache 2>&1 && \
             echo '---PUBLIC HTML SYNC---' && \
             rsync -a public/ public_html/ --exclude 'storage' && \
             echo 'DONE'" 2>&1
          echo "Deploy complete"
