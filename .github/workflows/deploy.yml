name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build Assets
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Hostinger
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -p $PORT"

          # Retry rsync up to 3 times
          for i in 1 2 3; do
            echo "=== Rsync attempt $i ==="
            sshpass -e rsync -avz \
              -e "ssh $SSH_OPTS" \
              --exclude '.git' \
              --exclude 'node_modules' \
              --exclude '.env' \
              --exclude 'tests' \
              --exclude 'storage/framework/cache/data/*' \
              ./ $USER@$HOST:domains/igx.co.id/ && break
            echo "Attempt $i failed, retrying..."
            sleep 15
          done

          # Cache clear — direct file removal (xargs -I{} incompatible on Hostinger)
          echo "=== Sync public to public_html ==="
          sshpass -e ssh $SSH_OPTS $USER@$HOST \
            "cd domains/igx.co.id && rm -rf storage/framework/views/* bootstrap/cache/* && rm -rf public_html/build public_html/fonts public_html/fnt && rsync -a public/ public_html/ --exclude 'storage' && for php in /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /opt/alt/php82/usr/bin/php /usr/bin/php; do [ -x \$php ] && \$php artisan optimize && break; done && ls -la public_html/build/manifest.json && cat public_html/build/manifest.json" || true
          echo "Deploy complete"
