name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build Assets
        run: |
          npm ci
          npm run build

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Hostinger
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=10 -p $PORT"

          # Retry rsync up to 3 times
          for i in 1 2 3; do
            echo "=== Rsync attempt $i ==="
            sshpass -e rsync -avz \
              -e "ssh $SSH_OPTS" \
              --exclude '.git' \
              --exclude 'node_modules' \
              --exclude '.env' \
              --exclude 'tests' \
              --exclude 'storage/framework/cache/data/*' \
              ./ $USER@$HOST:domains/igx.co.id/ && break
            echo "Attempt $i failed, retrying..."
            sleep 15
          done

          # Post-deploy setup: composer install + env + cache
          echo "=== Post-deploy setup ==="
          sshpass -e ssh $SSH_OPTS $USER@$HOST '
            cd domains/igx.co.id

            echo "---COMPOSER INSTALL---"
            # Hostinger disables proc_open — skip post-autoload scripts
            /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --no-scripts 2>&1 || echo "Composer had warnings (proc_open disabled)"

            echo "---ENV CHECK---"
            if [ -f .env ]; then
              echo ".env exists"
            else
              echo "Creating .env from .env.example"
              cp .env.example .env
            fi
            # Check if APP_KEY is set; generate manually if not (proc_open disabled)
            if ! grep -q "^APP_KEY=[A-Za-z0-9]" .env 2>/dev/null; then
              echo "Generating APP_KEY manually..."
              NEW_KEY="base64:$(openssl rand -base64 32)"
              sed -i "s|^APP_KEY=.*|APP_KEY=$NEW_KEY|" .env
              echo "APP_KEY set"
            fi

            echo "---ARTISAN CHECK---"
            /opt/alt/php84/usr/bin/php artisan --version 2>&1 || echo "ARTISAN FAIL"

            echo "---MIGRATE---"
            /opt/alt/php84/usr/bin/php artisan migrate --force 2>&1 || echo "MIGRATE FAIL"

            echo "---CLEAR CACHES---"
            /opt/alt/php84/usr/bin/php artisan view:clear 2>&1 || true
            /opt/alt/php84/usr/bin/php artisan config:clear 2>&1 || true
            /opt/alt/php84/usr/bin/php artisan cache:clear 2>&1 || true

            echo "---OPTIMIZE (fail loudly; clear on failure)---"
            if ! /opt/alt/php84/usr/bin/php artisan config:cache; then
              echo "CONFIG:CACHE FAILED - clearing"
              /opt/alt/php84/usr/bin/php artisan config:clear || true
            fi
            if ! /opt/alt/php84/usr/bin/php artisan route:cache; then
              echo "ROUTE:CACHE FAILED - clearing"
              /opt/alt/php84/usr/bin/php artisan route:clear || true
            fi
            if ! /opt/alt/php84/usr/bin/php artisan view:cache; then
              echo "VIEW:CACHE FAILED - clearing"
              /opt/alt/php84/usr/bin/php artisan view:clear || true
            fi
            echo "---CACHE VERIFY---"
            /opt/alt/php84/usr/bin/php artisan env 2>&1 | head -2 || echo "ARTISAN ENV FAIL"
            ls -la bootstrap/cache/config.php bootstrap/cache/routes-v7.php 2>&1

            echo "---PUBLIC HTML SYNC---"
            rsync -a public/ public_html/ --exclude "storage"

            echo "---VERIFY---"
            python3 -c "import json; d=json.load(open('"'"'public/build/manifest.json'"'"')); print(d['"'"'resources/css/app.css'"'"']['"'"'file'"'"'])"

            echo "DONE"
          ' 2>&1
          echo "Deploy complete"
